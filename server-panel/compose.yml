services:
  douyin-spark-flow-panel:
    image: ${PANEL_IMAGE:-ghcr.io/baroncmh/douyinsparkflow-open-source-panel:latest}
    container_name: douyin-spark-flow-panel
    restart: unless-stopped
    init: true
    shm_size: 1gb
    env_file:
      - ${PANEL_ENV_FILE:-./panel.env}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: 8080
      GITHUB_ACTIONS: "true"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:${PANEL_BIND_PORT:-18080}:8080"
    volumes:
      - ${CONFIG_DIR:-./config}:/app/config
      - ${LOG_DIR:-./logs}:/app/logs
