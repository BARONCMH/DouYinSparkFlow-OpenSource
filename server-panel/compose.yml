services:
  douyin-spark-flow-panel:
    image: ${PANEL_IMAGE:-ghcr.io/baroncmh/douyinsparkflow-open-source-panel:latest}
    container_name: douyin-spark-flow-panel
    restart: unless-stopped
    init: true
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/login >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file:
      - ${PANEL_ENV_FILE:-./panel.env}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      PANEL_HOST: 0.0.0.0
      PANEL_PORT: 8080
      GITHUB_ACTIONS: "true"
      PYTHONUNBUFFERED: "1"
    ports:
      - "127.0.0.1:${PANEL_BIND_PORT:-18080}:8080"
    volumes:
      - ${CONFIG_DIR:-./config}:/app/config
      - ${LOG_DIR:-./logs}:/app/logs
