name: Publish Multi-user Panel Docker Image

on:
  push:
    branches: [main]
    paths:
      - "server-panel/Dockerfile"
      - "server-panel/Dockerfile.dockerignore"
      - "server-panel/panel.py"
      - "server-panel/tasks.py"
      - "main.py"
      - "requirements.txt"
      - "core/**"
      - "utils/**"
      - "server-panel/compose.yml"
      - ".github/workflows/panel-docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish multi-user panel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/baroncmh/douyinsparkflow-open-source-panel
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-panel/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
